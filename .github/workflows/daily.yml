name: Tageslauf und GitHub Pages

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Erst die Stunde prüfen (reines Python mit zoneinfo), damit der Lauf zur falschen
      # Sommer-/Winterzeit-Stunde nicht erst torch und transformers installiert.
      - name: Stunde in Europe/Berlin prüfen
        id: hour
        env:
          EVENT_NAME: ${{ github.event_name }}
          PYTHONPATH: src
        run: |
          python - << 'PY'
          import os
          from datetime import datetime, timezone
          from nachrichten_sentiment.schedule import should_run_scheduled
          run = should_run_scheduled(datetime.now(timezone.utc), os.environ["EVENT_NAME"])
          print("run" if run else "skip: not 06:00 Europe/Berlin")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("run=" + ("true" if run else "false") + "\n")
          PY
      - name: FinBERT-Cache
        if: steps.hour.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-finbert-${{ runner.os }}-v1
      - name: Abhängigkeiten
        if: steps.hour.outputs.run == 'true'
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[ml]"
      - name: Tageslauf
        if: steps.hour.outputs.run == 'true'
        env:
          HF_HOME: ${{ github.workspace }}/.hf-cache
        run: python -m nachrichten_sentiment tageslauf
      - name: Stand committen
        if: success() && steps.hour.outputs.run == 'true'
        run: |
          git config user.name "ExplorationSE"
          git config user.email "ExplorationSE@users.noreply.github.com"
          git add data site
          git diff --cached --quiet || git commit -m "data: Tageslauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-pages-artifact@v3
        if: success() && steps.hour.outputs.run == 'true'
        with:
          path: site/

  deploy:
    needs: collect
    if: success() && needs.collect.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
